name: Bug report
description: Report something that is broken
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Does this qualify for hotfix/* per docs/BRANCHING.md?
      options:
        - "Blocking (site down, cart/checkout broken, login broken, data exposed) — hotfix candidate"
        - "Non-blocking (visual, typo, slowness without an error) — fix/* into dev"
    validations:
      required: true
